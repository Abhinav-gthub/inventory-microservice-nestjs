name: AI PR Reviewer (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          # 1. Pass the Gemini API Key instead of OpenAI
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 2. Instruct the bot to use the Gemini model
          PR_AGENT.CONFIG.MODEL: "gemini/gemini-1.5-pro-latest"